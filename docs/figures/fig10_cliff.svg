<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="The partial observation cliff">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="760" height="380"/><text class="ttl" x="24" y="26">Partial observation does not weaken higher-order structure. It erases it.</text><text class="sub" x="24" y="45">The same three-way dependence, measured with every participant visible and with one hidden.</text><text class="lbl" x="238" y="101.5" text-anchor="end">all three participants</text><rect x="250" y="79.9" width="360.0" height="35.3" fill="#2563eb" rx="2"/><text class="tick" x="619.0" y="101.5" fill="#2563eb">0.7246</text><text class="lbl" x="238" y="164.5" text-anchor="end">missing one (c)</text><rect x="250" y="142.9" width="1.2" height="35.3" fill="#dc2626" rx="2"/><text class="tick" x="260.2" y="164.5" fill="#dc2626">0.00000</text><text class="lbl" x="238" y="227.5" text-anchor="end">missing one (b)</text><rect x="250" y="205.9" width="1.2" height="35.3" fill="#dc2626" rx="2"/><text class="tick" x="260.2" y="227.5" fill="#dc2626">0.00053</text><text class="lbl" x="238" y="290.5" text-anchor="end">missing one, 5x the data</text><rect x="250" y="268.9" width="1.2" height="35.3" fill="#dc2626" rx="2"/><text class="tick" x="260.2" y="290.5" fill="#dc2626">0.00006</text><text class="sub" x="24" y="340">A three-way dependence marginalised over one of its three participants is uniform. There is nothing left to detect —</text><text class="sub" x="24" y="356">not a faint signal, nothing. Five times the data moves it from 0.00005 to 0.00006. This is an identifiability limit,</text><text class="sub" x="24" y="372">not a power limit: no quantity of observation recovers it.</text></svg>