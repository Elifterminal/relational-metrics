<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Completeness witness">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">Two structures both instruments agree on, that are not the same structure</text><text class="sub" x="24" y="45">Same importance for every participant. Same distribution across interaction orders. Different organisation.</text><text class="sub" x="24" y="66">influence <tspan font-weight="600">[0.5, 0.5, 0.5, 0.5]</tspan>   ·   order profile <tspan font-weight="600">[0.25, 0.25, 0.0, 0.25, 0.25]</tspan></text><line class="ax" x1="120" y1="338.0" x2="556" y2="338.0"/><text class="tick" x="111" y="342.0" text-anchor="end">0.00</text><line class="ax" x1="120" y1="257.3" x2="556" y2="257.3"/><text class="tick" x="111" y="261.3" text-anchor="end">0.10</text><line class="ax" x1="120" y1="176.7" x2="556" y2="176.7"/><text class="tick" x="111" y="180.7" text-anchor="end">0.20</text><line class="ax" x1="120" y1="96.0" x2="556" y2="96.0"/><text class="tick" x="111" y="100.0" text-anchor="end">0.30</text><text class="lbl" x="338" y="386" text-anchor="middle">the 16 possible participant subsets, sorted by weight</text><text class="lbl" transform="translate(26,217) rotate(-90)" text-anchor="middle">weight carried</text><rect x="122.7" y="338.0" width="8.8" height="1.0" fill="#2563eb" rx="1.5"/><rect x="133.1" y="338.0" width="8.8" height="1.0" fill="#dc2626" rx="1.5"/><rect x="150.0" y="338.0" width="8.8" height="1.0" fill="#2563eb" rx="1.5"/><rect x="160.3" y="338.0" width="8.8" height="1.0" fill="#dc2626" rx="1.5"/><rect x="177.2" y="338.0" width="8.8" height="1.0" fill="#2563eb" rx="1.5"/><rect x="187.6" y="338.0" width="8.8" height="1.0" fill="#dc2626" rx="1.5"/><rect x="204.5" y="338.0" width="8.8" height="1.0" fill="#2563eb" rx="1.5"/><rect x="214.8" y="338.0" width="8.8" height="1.0" fill="#dc2626" rx="1.5"/><rect x="231.7" y="338.0" width="8.8" height="1.0" fill="#2563eb" rx="1.5"/><rect x="242.1" y="338.0" width="8.8" height="1.0" fill="#dc2626" rx="1.5"/><rect x="259.0" y="338.0" width="8.8" heigh