 class="sub" x="574" y="176">into FOUR subsets and</text><text class="sub" x="574" y="191">leaves twelve empty.</text><text class="sub" x="574" y="206"></text><text class="sub" x="574" y="221">B spreads the same total</text><text class="sub" x="574" y="236">across TEN.</text><text class="sub" x="574" y="251"></text><text class="sub" x="574" y="266">Every summary either</text><text class="sub" x="574" y="281">instrument computes is</text><text class="sub" x="574" y="296">identical for both.</text></svg>