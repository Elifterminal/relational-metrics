<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="Connected information by order">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="780" height="420"/><text class="ttl" x="24" y="26">F-04a: structure lands at the order it actually belongs to</text><text class="sub" x="24" y="43">Connected information in bits — how much the maximum possible entropy drops once marginals of that order are known.</text><line class="ax" x1="62" y1="346.0" x2="580" y2="346.0"/><text class="tick" x="53" y="350.0" text-anchor="end">0.00</text><line class="ax" x1="62" y1="288.4" x2="580" y2="288.4"/><text class="tick" x="53" y="292.4" text-anchor="end">0.25</text><line class="ax" x1="62" y1="230.8" x2="580" y2="230.8"/><text class="tick" x="53" y="234.8" text-anchor="end">0.50</text><line class="ax" x1="62" y1="173.2" x2="580" y2="173.2"/><text class="tick" x="53" y="177.2" text-anchor="end">0.75</text><line class="ax" x1="62" y1="115.6" x2="580" y2="115.6"/><text class="tick" x="53" y="119.6" text-anchor="end">1.00</text><line class="ax" x1="62" y1="58.0" x2="580" y2="58.0"/><text class="tick" x="53" y="62.0" text-anchor="end">1.25</text><rect x="80.5" y="345.8" width="37.0" height="0.2" fill="#94a3b8" rx="1.5"/><rect x="80.5" y="345.7" width="37.0" height="0.1" fill="#2563eb" rx="1.5"/><text class="lbl" x="99.0" y="366" text-anchor="middle">null</text><text class="sub" x="99.0" y="381" text-anchor="middle">arity 0</text><rect x="154.5" y="177.0" width="37.0" height="169.0" fill="#94a3b8" rx="1.5"/><rect x="154.5" y="176.8" width="37.0" height="0.2" fill="#2563eb" rx="1.5"/><rect x="154.5" y="176.8" width="37.0" height="0.0" fill="#dc2626" rx="1.5"/><text class="lbl" x="173.0" y="366" text-anchor="middle">order1</text><text class="sub" x="173.0" y="381" text-anchor="middle">arity 1</text><rect x="228.5" y="345.9" width="37.0" height="0.1" fill="#94a3b8" rx="1.5"/><rect x="228.5" y="176.9" width="37.0" height="169.0" fill="#2563eb" rx="1.5"/><rect x="228.5" y="176.8" width="37.0" height="0.0" fill="#dc2626" rx="1.5"/><text class="lbl" x="247.0" y="366" text-anchor="middle">order2</text><text class="sub" x="247.0" y="381" text-anchor="middle">arity 2</text><rect x="302.5" y="345.7" width="37.0" height="0.3" fill="#94a3b8" rx="1.5"/><rect x="302.5" y="345.6" width="37.0" height="0.1" fill="#2563eb" rx="1.5"/><rect x="302.5" y="176.8" width="37.0" height="168.8" fill="#dc2626" rx="1.5"/><text class="lbl" x="321.0" y="366" text-anchor="middle">order3</text><text class="sub" x="321.0" y="381" text-anchor="middle">arity 3 *</text><rect x="376.5" y="292.8" width="37.0" height="53.2" fill="#94a3b8" rx="1.5"/><rect x="376.5" y="270.9" width="37.0" height="21.9" fill="#2563eb" rx="1.5"/><rect x="376.5" y="266.7" width="37.0" height="4.3" fill="#dc2626" rx="1.5"/><text class="lbl" x="395.0" y="366" text-anchor="middle">order3_and</text><text class="sub" x="395.0" y="381" text-anchor="middle">arity 3 *</text><rect x="450.5" y="195.4" width="37.0" height="150.6" fill="#94a3b8" rx="1.5"/><rect x="450.5" y="194.4" width="37.0" height="1.0" fill="#2563eb" rx="1.5"/><rect x="450.5" y="176.8" width="37.0" height="17.6" fill="#dc2626" rx="1.5"/><text class="lbl" x="469.0" y="366" text-anchor="middle">majority</text><text class="sub" x="469.0" y="381" text-anchor="middle">arity 3 *</text><rect x="524.5" y="62.7" width="37.0" height="283.3" fill="#94a3b8" rx="1.5"/><rect x="524.5" y="62.6" width="37.0" height="0.1" fill="#2563eb" rx="1.5"/><rect x="524.5" y="62.5" width="37.0" height="0.1" fill="#dc2626" rx="1.5"/><text class="lbl" x="543.0" y="366" text-anchor="middle">redundant</text><text class="sub" x="543.0" y="381" text-anchor="middle">arity 1</text><rect x="600" y="57" width="13" height="12" fill="#94a3b8" rx="2"/><text class="lbl" x="619" y="67">order 2 (pairwise)</text><rect x="600" y="78" width="13" height="12" fill="#2563eb" rx="2"/><text class="lbl" x="619" y="88">order 3</text><rect x="600" y="99" width="13" height="12" fill="#dc2626" rx="2"/><text class="lbl" x="619" y="109">order 4 (all three + outcome)</text><text class="sub" x="600" y="145">order2 -&gt; order 3.</text><text class="sub" x="600" y="160">order3 -&gt; order 4.</text><text class="sub" x="600" y="181">redundant puts ALL of</text><text class="sub" x="600" y="196">its 1.23 bits at order 2</text><text class="sub" x="600" y="211">— where it belongs.</text><text class="sub" x="600" y="226">F-04 called it 3-way.</text><text class="sub" x="24" y="406">* marks a significant order-4 term against a 120-permutation null. Every term is non-negative by construction, and they sum to the total.</text></svg>