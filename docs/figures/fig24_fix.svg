.3" fill="#d97706" rx="2" opacity="0.35"/><text x="507.8" y="241.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="559.2" y="226.2" width="85.8" height="23.3" fill="#94a3b8" rx="2" opacity="0.35"/><text x="602.6" y="241.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><text class="tick" x="660" y="241.8" fill="#15803d">X &gt; W</text><text class="lbl" x="164" y="283.5" text-anchor="end" fill="var(--fg)">HELD-OUT · threshold</text><rect x="178.0" y="264.5" width="183.6" height="30.0" fill="none" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="3 2" rx="4" opacity="0.5"/><rect x="180.0" y="267.8" width="85.8" height="23.3" fill="#2563eb" rx="2" opacity="0.35"/><text x="223.4" y="283.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="274.8" y="267.8" width="85.8" height="23.3" fill="#15803d" rx="2" opacity="0.95"/><text x="318.2" y="283.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="369.6" y="267.8" width="85.8" height="23.3" fill="#dc2626" rx="2" opacity="0.95"/><text x="413.0" y="283.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><rect x="464.4" y="267.8" width="85.8" height="23.3" fill="#94a3b8" rx="2" opacity="0.35"/><text x="507.8" y="283.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><rect x="559.2" y="267.8" width="85.8" height="23.3" fill="#d97706" rx="2" opacity="0.35"/><text x="602.6" y="283.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><text class="tick" x="660" y="283.5" fill="#15803d">X &gt; W</text><text class="lbl" x="164" y="325.2" text-anchor="end" fill="var(--fg)">HELD-OUT · substitution</text><rect x="178.0" y="306.2" width="183.6" height="30.0" fill="none" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="3 2" rx="4" opacity="0.5"/><rect x="180.0" y="309.5" width="85.8" height="23.3" fill="#2563eb" rx="2" opacity="0.35"/><text x="223.4" y="325.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="274.8" y="309.5" width="85.8" height="23.3" fill="#15803d" rx="2" opacity="0.95"/><text x="318.2" y="325.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="369.6" y="309.5" width="85.8" height="23.3" fill="#94a3b8" rx="2" opacity="0.35"/><text x="413.0" y="325.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><rect x="464.4" y="309.5" width="85.8" height="23.3" fill="#dc2626" rx="2" opacity="0.95"/><text x="507.8" y="325.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><rect x="559.2" y="309.5" width="85.8" height="23.3" fill="#d97706" rx="2" opacity="0.35"/><text x="602.6" y="325.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><text class="tick" x="660" y="325.2" fill="#15803d">X &gt; W</text><text class="sub" x="24" y="374">Six of six. Paraphrase and analogue score IDENTICALLY — bracketed as an exact tie, not ranked against each other, which is what a</text><text class="sub" x="24" y="388">structure-only measure must do, since they are structurally the same thing wearing different words.</text></svg>