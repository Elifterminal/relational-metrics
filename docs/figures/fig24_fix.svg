<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="The fix on held-out data">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">The fix, on data frozen before the fix existed</text><text class="sub" x="24" y="45">Relation-type cost is now name-independent. Green = cross-domain analogue, red = false friend sharing the query's vocabulary.</text><text class="sub" x="24" y="64">The held-out corpus was written and committed BEFORE the change landed. Its three rows are the result; the dev rows are a sanity check only.</text><rect x="24" y="73" width="11" height="10" fill="#2563eb" rx="2"/><text class="sub" x="40" y="82">P paraphrase</text><rect x="174" y="73" width="11" height="10" fill="#15803d" rx="2"/><text class="sub" x="190" y="82">X analogue</text><rect x="324" y="73" width="11" height="10" fill="#dc2626" rx="2"/><text class="sub" x="340" y="82">W false friend</text><rect x="474" y="73" width="11" height="10" fill="#d97706" rx="2"/><text class="sub" x="490" y="82">V generic</text><rect x="624" y="73" width="11" height="10" fill="#94a3b8" rx="2"/><text class="sub" x="640" y="82">U unrelated</text><text class="lbl" x="164" y="116.8" text-anchor="end" fill="var(--mut)">dev · reinforcing</text><rect x="178.0" y="97.8" width="183.6" height="30.0" fill="none" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="3 2" rx="4" opacity="0.5"/><rect x="180.0" y="101.2" width="85.8" height="23.3" fill="#2563eb" rx="2" opacity="0.35"/><text x="223.4" y="116.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="274.8" y="101.2" width="85.8" height="23.3" fill="#15803d" rx="2" opacity="0.95"/><text x="318.2" y="116.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="369.6" y="101.2" width="85.8" height="23.3" fill="#d97706" rx="2" opacity="0.35"/><text x="413.0" y="116.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="464.4" y="101.2" width="85.8" height="23.3" fill="#94a3b8" rx="2" opacity="0.35"/><text x="507.8" y="116.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><rect x="559.2" y="101.2" width="85.8" height="23.3" fill="#dc2626" rx="2" opacity="0.95"/><text x="602.6" y="116.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><text class="tick" x="660" y="116.8" fill="#15803d">X &gt; W</text><text class="lbl" x="164" y="158.5" text-anchor="end" fill="var(--mut)">dev · regulating</text><rect x="178.0" y="139.5" width="183.6" height="30.0" fill="none" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="3 2" rx="4" opacity="0.5"/><rect x="180.0" y="142.8" width="85.8" height="23.3" fill="#2563eb" rx="2" opacity="0.35"/><text x="223.4" y="158.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="274.8" y="142.8" width="85.8" height="23.3" fill="#15803d" rx="2" opacity="0.95"/><text x="318.2" y="158.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="367.6" y="139.5" width="183.6" height="30.0" fill="none" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="3 2" rx="4" opacity="0.5"/><rect x="369.6" y="142.8" width="85.8" height="23.3" fill="#d97706" rx="2" opacity="0.35"/><text x="413.0" y="158.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="464.4" y="142.8" width="85.8" height="23.3" fill="#dc2626" rx="2" opacity="0.95"/><text x="507.8" y="158.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><rect x="559.2" y="142.8" width="85.8" height="23.3" fill="#94a3b8" rx="2" opacity="0.35"/><text x="602.6" y="158.5" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><text class="tick" x="660" y="158.5" fill="#15803d">X &gt; W</text><text class="lbl" x="164" y="200.2" text-anchor="end" fill="var(--mut)">dev · cascade</text><rect x="178.0" y="181.2" width="278.4" height="30.0" fill="none" stroke="var(--fg)" stroke-width