<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-label="Retention blindness witness">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="780" height="380"/><text class="ttl" x="24" y="26">Two structures with identical predictions and opposite organisation</text><text class="sub" x="24" y="45">Same influence profile, same outcome entropy — so the retention law gives them the same answer, exactly.</text><text class="sub" x="24" y="66">Identical retention vector: <tspan font-weight="600">[0.3837, 0.3837, 0.3837]</tspan>   ·   influence [0.5, 0.5, 0.5]   ·   H=0.8113</text><text class="lbl" x="150.2" y="338" text-anchor="middle">order 0</text><text class="lbl" x="258.8" y="338" text-anchor="middle">order 1</text><text class="lbl" x="367.2" y="338" text-anchor="middle">order 2</text><text class="lbl" x="475.8" y="338" text-anchor="middle">order 3</text><line class="ax" x1="96" y1="318.0" x2="530" y2="318.0"/><text class="tick" x="87" y="322.0" text-anchor="end">0.00</text><line class="ax" x1="96" y1="262.5" x2="530" y2="262.5"/><text class="tick" x="87" y="266.5" text-anchor="end">0.25</text><line class="ax" x1="96" y1="207.0" x2="530" y2="207.0"/><text class="tick" x="87" y="211.0" text-anchor="end">0.50</text><line class="ax" x1="96" y1="151.5" x2="530" y2="151.5"/><text class="tick" x="87" y="155.5" text-anchor="end">0.75</text><line class="ax" x1="96" y1="96.0" x2="530" y2="96.0"/><text class="tick" x="87" y="100.0" text-anchor="end">1.00</text><text class="lbl" transform="translate(26,207) rotate(-90)" text-anchor="middle">share of the structure</text><rect x="111.2" y="262.5" width="31.7" height="55.5" fill="#2563eb" rx="2"/><text class="tick" x="127.1" y="256.5" text-anchor="middle" fill="#2563eb">0.25</text><rect x="148.1" y="262.5" width="31.7" height="55.5" fill="#dc2626" rx="2"/><text class="tick" x="163.9" y="256.5" text-anchor="middle" fill="#dc2626">0.25</text><rect x="219.7" y="262.5" width="31.7" height="55.5" fill="#2563eb" rx="2"/><text class="tick" x="235.6" y="256.5" text-anchor="middle" fill="#2563eb">0.25</text><rect x="256.6" y="318.0" width="31.7" height="1.0" fill="#dc2626" rx="2"/><rect x="328.2" y="262.5" width="31.7" height="55.5" fill="#2563eb" rx="2"/><text class="tick" x="344.1" y="256.5" text-anchor="middle" fill="#2563eb">0.25</text><rect x="365.1" y="151.5" width="31.7" height="166.5" fill="#dc2626" rx="2"/><text class="tick" x="380.9" y="145.5" text-anchor="middle" fill="#dc2626">0.75</text><rect x="436.7" y="262.5" width="31.7" height="55.5" fill="#2563eb" rx="2"/><text class="tick" x="452.6" y="256.5" text-anchor="middle" fill="#2563eb">0.25</text><rect x="473.6" y="318.0" width="31.7" height="1.0" fill="#dc2626" rx="2"/><rect x="550" y="93" width="13" height="12" fill="#2563eb" rx="2"/><text class="lbl" x="569" y="103">structure A</text><rect x="550" y="115" width="13" height="12" fill="#dc2626" rx="2"/><text class="lbl" x="569" y="125">structure B</text><text class="sub" x="550" y="146"></text><text class="sub" x="550" y="161">A spreads its organisation</text><text class="sub" x="550" y="176">evenly across every order.</text><text class="sub" x="550" y="191"></text><text class="sub" x="550" y="206">B puts THREE QUARTERS of</text><text class="sub" x="550" y="221">itself at order 2 and has</text><text class="sub" x="550" y="236">NOTHING at orders 1 or 3.</text><text class="sub" x="550" y="251"></text><text class="sub" x="550" y="266">The law returns the same</text><text class="sub" x="550" y="281">number for both — not</text><text class="sub" x="550" y="296">approximately, exactly.</text></svg>