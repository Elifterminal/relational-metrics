<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Expressivity boundary audit">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="450"/><text class="ttl" x="24" y="26">What the representation cannot tell apart — tested in advance</text><text class="sub" x="24" y="45">A witness pair is two cases needing DIFFERENT answers whose structures are the same. One such pair proves</text><text class="sub" x="24" y="61">no measure on that representation can ever work. Not "has not yet" — cannot.</text><text class="lbl" x="24" y="92">distinction wanted</text><text class="lbl" x="480" y="92">verdict</text><text class="lbl" x="620" y="92">channel it would need</text><rect x="24" y="120" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="139">genuine analogue vs vacuous restatement</text><text class="tick" x="480" y="139" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="139" fill="var(--mut)">specificity / referentia…</text><rect x="24" y="154" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="173">real participant vs inserted mediator</text><text class="tick" x="480" y="173" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="173" fill="var(--mut)">ontological role declara…</text><rect x="24" y="188" width="752" height="28" fill="#15803d" opacity="0.07" rx="3"/><text class="tick" x="34" y="207">which link carries the coupling (relative weights)</text><text class="tick" x="480" y="207" fill="#15803d" font-weight="600">identifiable</text><text class="tick" x="620" y="207" fill="var(--mut)">magnitude channel -- BUI…</text><rect x="24" y="222" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="241">reinforcing vs regulating by DELAY, same static graph</text><text class="tick" x="480" y="241" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="241" fill="var(--mut)">temporal channel (order …</text><rect x="24" y="256" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="275">asserted claim vs empirically observed relation</text><text class="tick" x="480" y="275" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="275" fill="var(--mut)">provenance / evidence ch…</text><rect x="24" y="290" width="752" height="28" fill="#15803d" opacity="0.07" rx="3"/><text class="tick" x="34" y="309">reinforcing vs balancing loop (CONTROL -- should be …</text><text class="tick" x="480" y="309" fill="#15803d" font-weight="600">identifiable</text><text class="tick" x="620" y="309" fill="var(--mut)">none needed</text><text class="sub" x="24" y="346">4 of 6 are provably outside the current representation. The last row is a CONTROL — it comes back</text><text class="sub" x="24" y="361">identifiable, which is how you know the audit can return both answers. A test with only one possible result is not a test.</text><text class="sub" x="24" y="383" fill="#15803d">Found by this audit and since REPAIRED: relation strength was invisible. Now relative coupling shows (2.1168 vs 1.7160)</text><text class="sub" x="24" y="398" fill="#15803d">while unit conversion stays invariant — so the first experiment's "invariant to rescaling" control can finally fail, and passes honestly.</text></svg>