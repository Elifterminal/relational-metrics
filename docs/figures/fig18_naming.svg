<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-label="Naming bias">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="780" height="360"/><text class="ttl" x="24" y="26">Naming a function biases you toward the ones that hide the problem</text><text class="sub" x="24" y="45">Share that is influence-symmetric — every participant matters equally, so a careless summary looks safe.</text><line class="ax" x1="150.0" y1="70" x2="150.0" y2="300"/><text class="tick" x="150.0" y="318" text-anchor="middle">0%</text><line class="ax" x1="228.0" y1="70" x2="228.0" y2="300"/><text class="tick" x="228.0" y="318" text-anchor="middle">20%</text><line class="ax" x1="306.0" y1="70" x2="306.0" y2="300"/><text class="tick" x="306.0" y="318" text-anchor="middle">40%</text><line class="ax" x1="384.0" y1="70" x2="384.0" y2="300"/><text class="tick" x="384.0" y="318" text-anchor="middle">60%</text><line class="ax" x1="462.0" y1="70" x2="462.0" y2="300"/><text class="tick" x="462.0" y="318" text-anchor="middle">80%</text><line class="ax" x1="540.0" y1="70" x2="540.0" y2="300"/><text class="tick" x="540.0" y="318" text-anchor="middle">100%</text><text class="lbl" x="138" y="106.2" text-anchor="end">k=3  functions you can name</text><rect x="150" y="87.6" width="273.0" height="29.4" fill="#dc2626" rx="2"/><text class="tick" x="432.0" y="106.2" fill="#dc2626">70.0%</text><text class="lbl" x="138" y="162.8" text-anchor="end">k=3  all functions</text><rect x="150" y="144.1" width="150.5" height="29.4" fill="#2563eb" rx="2"/><text class="tick" x="309.5" y="162.8" fill="#2563eb">38.6%</text><text class="lbl" x="138" y="219.2" text-anchor="end">k=4  functions you can name</text><rect x="150" y="200.6" width="260.0" height="29.4" fill="#dc2626" rx="2"/><text class="tick" x="419.0" y="219.2" fill="#dc2626">66.7%</text><text class="lbl" x="138" y="275.8" text-anchor="end">k=4  all functions</text><rect x="150" y="257.1" width="42.7" height="29.4" fill="#2563eb" rx="2"/><text class="tick" x="201.7" y="275.8" fill="#2563eb">10.9%</text><text class="sub" x="558" y="80">Over-representation:</text><text class="sub" x="558" y="95">  1.81x at three participants</text><text class="sub" x="558" y="110">  6.09x at four</text><text class="sub" x="558" y="125"></text><text class="sub" x="558" y="140">And it GROWS with arity —</text><text class="sub" x="558" y="155">symmetric functions get</text><text class="sub" x="558" y="170">rarer while the ones that</text><text class="sub" x="558" y="185">come to mind do not.</text><text class="sub" x="558" y="200"></text><text class="sub" x="558" y="215">At k=3 the nameable list is</text><text class="sub" x="558" y="230">parity, and, or, majority,</text><text class="sub" x="558" y="245">mux, nand — every one of</text><text class="sub" x="558" y="260">them symmetric.</text><text class="sub" x="24" y="348">This is not carelessness. It is what naming does — and it is why the test set had to be built by influence profile rather than by example.</text></svg>