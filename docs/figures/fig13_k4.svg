<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">Quantisation survives at four variables — and there is a closed form</text><text class="sub" x="24" y="45">All 65,536 Boolean functions of four variables, computed exactly. Only 21 distinct retention values.</text><rect x="24" y="56" width="752" height="30" fill="var(--fg)" opacity="0.05" rx="6"/><text class="ttl" x="400" y="76" text-anchor="middle">retention  =  1  −  Influence(hidden participant) / H(outcome)</text><line class="ax" x1="70" y1="336.0" x2="590" y2="336.0"/><text class="tick" x="61" y="340.0" text-anchor="end">0k</text><line class="ax" x1="70" y1="277.0" x2="590" y2="277.0"/><text class="tick" x="61" y="281.0" text-anchor="end">4k</text><line class="ax" x1="70" y1="218.0" x2="590" y2="218.0"/><text class="tick" x="61" y="222.0" text-anchor="end">9k</text><line class="ax" x1="70" y1="159.0" x2="590" y2="159.0"/><text class="tick" x="61" y="163.0" text-anchor="end">13k</text><line class="ax" x1="70" y1="100.0" x2="590" y2="100.0"/><text class="tick" x="61" y="104.0" text-anchor="end">17k</text><text class="lbl" transform="translate(22,218) rotate(-90)" text-anchor="middle">functions</text><rect x="76.1" y="100.0" width="31.2" height="236.0" fill="#94a3b8" rx="2"/><text class="tick" x="91.7" y="354" text-anchor="middle" transform="rotate(-40 91.7 354)">0.621</text><rect x="119.4" y="203.6" width="31.2" height="132.4" fill="#94a3b8" rx="2"/><text class="tick" x="135.0" y="354" text-anchor="middle" transform="rotate(-40 135.0 354)">0.738</text><rect x="162.7" y="244.8" width="31.2" height="91.2" fill="#94a3b8" rx="2"/><text class="tick" x="178.3" y="354" text-anchor="middle" transform="rotate(-40 178.3 354)">0.750</text><rect x="206.1" y="247.9" width="31.2" height="88.1" fill="#94a3b8" rx="2"/><text class="tick" x="221.7" y="354" text-anchor="middle" transform="rotate(-40 221.7 354)">0.581</text><rect x="249.4" y="254.4" width="31.2" height="81.6" fill="#2563eb" rx="2"/><text clas