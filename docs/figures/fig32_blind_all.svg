<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Blind across three corpora">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">The same claim, annotated blind, on all three corpora</text><text class="sub" x="24" y="45">Sighted, the analogue beat the decoy 10 times out of 10. With the roles hidden it is 6 out of 10.</text><text class="tick" x="130" y="78">score, blind vs sighted</text><text class="tick" x="490" y="78">inflation</text><text class="tick" x="600" y="78">relations kept</text><text class="lbl" x="118" y="104" text-anchor="end">independent</text><rect x="132.0" y="90" width="70.0" height="20" fill="#2563eb" stroke="none" rx="3"/><rect x="207.0" y="90" width="70.0" height="20" fill="#2563eb" stroke="none" rx="3"/><rect x="282.0" y="90" width="70.0" height="20" fill="#2563eb" stroke="none" rx="3"/><rect x="357.0" y="90" width="70.0" height="20" fill="#e2e8f0" stroke="#94a3b8" rx="3"/><text class="tick" x="440" y="105" font-family="monospace">3/4</text><text class="tick" x="500" y="105" font-family="monospace" fill="#d97706">1.34x</text><text class="tick" x="610" y="105" font-family="monospace" fill="#15803d">0.85</text><text class="lbl" x="118" y="150" text-anchor="end">dev</text><rect x="132.0" y="136" width="95.0" height="20" fill="#2563eb" stroke="none" rx="3"/><rect x="232.0" y="136" width="95.0" height="20" fill="#2563eb" stroke="none" rx="3"/><rect x="332.0" y="136" width="95.0" height="20" fill="#e2e8f0" stroke="#94a3b8" rx="3"/><text class="tick" x="440" y="151" font-family="monospace">2/3</text><text class="tick" x="500" y="151" font-family="monospace" fill="#dc2626">1.92x</text><text class="tick" x="610" y="151" font-family="monospace" fill="#dc2626">0.47</text><text class="lbl" x="118" y="196" text-anchor="end">held-out</text><rect x="132.0" y="182" width="95.0" height="20" fill="#2563eb" stroke="none" rx="3"/><rect x="232.0" y="182" width="95.0" height="20" fill="#e2e8f0" stroke="#94a3b8" rx="3"/><rect x="332.0" y="182" width="95.0" height="20" fill="#e2e8f0" stroke="#94a3b8" rx="3"/><text class="tick" x="440" y="197" font-family="monospace">1/3</text><text class="tick" x="500" y="197" font-family="monospace" fill="#d97706">1.43x</text><text class="tick" x="610" y="197" font-family="monospace" fill="#dc2626">0.50</text><text class="sub" x="24" y="244" fill="#dc2626">But the last column blocks a clean conclusion: on two corpora my blind pass wrote down HALF the relations of the</text><text class="sub" x="24" y="259" fill="#dc2626">sighted pass. Fewer relations means less to match, whether or not I knew the roles. Only the top row is granularity-matched.</text><text class="sub" x="24" y="284" fill="#d97706">And two defects in the corpora themselves: 6 glosses ANNOUNCE their role in the prose — all of them decoys —</text><text class="sub" x="24" y="299" fill="#d97706">and the sighted annotation gives 4 relations to 9-word sentences, encoding structure the documents do not contain.</text><text class="sub" x="24" y="322">Direction confirmed: knowing the answer helps. Size still unmeasured.</text></svg>