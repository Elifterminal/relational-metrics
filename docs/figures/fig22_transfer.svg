<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Cross-generator transfer">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="380"/><text class="ttl" x="24" y="26">Does the correspondence measure work on shapes it was never built for?</text><text class="sub" x="24" y="45">Five base topologies. The conditions are derived identically from each, so the only thing varying is the shape.</text><line class="ax" x1="236.0" y1="72" x2="236.0" y2="322"/><text class="tick" x="236.0" y="340" text-anchor="middle">0.0</text><line class="ax" x1="333.0" y1="72" x2="333.0" y2="322"/><text class="tick" x="333.0" y="340" text-anchor="middle">0.5</text><line class="ax" x1="430.0" y1="72" x2="430.0" y2="322"/><text class="tick" x="430.0" y="340" text-anchor="middle">1.0</text><line class="ax" x1="527.0" y1="72" x2="527.0" y2="322"/><text class="tick" x="527.0" y="340" text-anchor="middle">1.5</text><line class="ax" x1="624.0" y1="72" x2="624.0" y2="322"/><text class="tick" x="624.0" y="340" text-anchor="middle">2.0</text><text class="lbl" x="430" y="366" text-anchor="middle">compression ratio</text><text class="lbl" x="222" y="104.6" text-anchor="end" font-style="italic">motif (development family)</text><rect x="236" y="81.9" width="345.2" height="7.9" fill="#2563eb" rx="1.5"/><rect x="236" y="91.7" width="276.1" height="7.9" fill="#d97706" rx="1.5"/><rect x="236" y="101.6" width="254.3" height="7.9" fill="#94a3b8" rx="1.5"/><rect x="236" y="111.4" width="222.9" height="7.9" fill="#64748b" rx="1.5"/><text class="tick" x="634" y="104.6" fill="#15803d">B &gt; E &gt; C &gt; D</text><text class="lbl" x="222" y="153.8" text-anchor="end" >chain (acyclic)</text><rect x="236" y="131.1" width="345.2" height="7.9" fill="#2563eb" rx="1.5"/><rect x="236" y="140.9" width="276.1" height="7.9" fill="#d97706" rx="1.5"/><rect x="236" y="150.8" width="254.3" height="7.9" fill="#94a3b8" rx="1.5"/><rect x="236" y="160.6" width="254.3" height="7.9" fill="#64748b" rx="1.5"/><text class="tick" x="634" y="153.8" fill="#15803d">B &gt; E &gt; C &gt; D</text><text class="lbl" x="222" y="203.0" text-anchor="end" >hub (concentrated degree)</text><rect x="236" y="180.3" width="346.4" height="7.9" fill="#2563eb" rx="1.5"/><rect x="236" y="190.1" width="277.5" height="7.9" fill="#d97706" rx="1.5"/><rect x="236" y="200.0" width="257.7" height="7.9" fill="#94a3b8" rx="1.5"/><rect x="236" y="209.8" width="226.5" height="7.9" fill="#64748b" rx="1.5"/><text class="tick" x="634" y="203.0" fill="#15803d">B &gt; E &gt; C &gt; D</text><text class="lbl" x="222" y="252.2" text-anchor="end" >lattice (parallel paths)</text><rect x="236" y="229.5" width="346.4" height="7.9" fill="#2563eb" rx="1.5"/><rect x="236" y="239.3" width="277.5" height="7.9" fill="#d97706" rx="1.5"/><rect x="236" y="249.2" width="226.5" height="7.9" fill="#94a3b8" rx="1.5"/><rect x="236" y="259.0" width="257.7" height="7.9" fill="#64748b" rx="1.5"/><text class="tick" x="634" y="252.2" fill="#15803d">B &gt; E &gt; D &gt; C</text><text class="lbl" x="222" y="301.4" text-anchor="end" >random_dag (unshaped)</text><rect x="236" y="278.7" width="345.2" height="7.9" fill="#2563eb" rx="1.5"/><rect x="236" y="288.5" width="276.1" height="7.9" fill="#d97706" rx="1.5"/><rect x="236" y="298.4" width="222.9" height="7.9" fill="#94a3b8" rx="1.5"/><rect x="236" y="308.2" width="254.3" height="7.9" fill="#64748b" rx="1.5"/><text class="tick" x="634" y="301.4" fill="#15803d">B &gt; E &gt; D &gt; C</text><rect x="24" y="71" width="11" height="10" fill="#2563eb" rx="2"/><text class="sub" x="40" y="80">B  perfect analogue</text><rect x="24" y="85" width="11" height="10" fill="#d97706" rx="2"/><text class="sub" x="40" y="94">E  near-miss</text><rect x="24" y="99" width="11" height="10" fill="#94a3b8" rx="2"/><text class="sub" x="40" y="108">C  same words, rewired</text><rect x="24" y="113" width="11" height="10" fill="#64748b" rx="2"/><text class="sub" x="40" y="122">D  matched random</text><text class="sub" x="24" y="350">The italic row is the family the measure was developed on. The graded ordering B > E > {C, D} holds on all five,</text><text class="sub" x="24" y="364">including a topology with no cycles at all and one that nobody designed.</text></svg>