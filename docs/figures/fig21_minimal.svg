<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Minimal invariant search">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="380"/><text class="ttl" x="24" y="26">How much structure each summary can actually distinguish</text><text class="sub" x="24" y="45">Distinct values each invariant takes, against the 222 genuinely different structures at four participants.</text><line class="ax" x1="214.0" y1="70" x2="214.0" y2="322"/><text class="tick" x="214.0" y="340" text-anchor="middle">0</text><line class="ax" x1="316.5" y1="70" x2="316.5" y2="322"/><text class="tick" x="316.5" y="340" text-anchor="middle">56</text><line class="ax" x1="419.0" y1="70" x2="419.0" y2="322"/><text class="tick" x="419.0" y="340" text-anchor="middle">111</text><line class="ax" x1="521.5" y1="70" x2="521.5" y2="322"/><text class="tick" x="521.5" y="340" text-anchor="middle">166</text><line class="ax" x1="624.0" y1="70" x2="624.0" y2="322"/><text class="tick" x="624.0" y="340" text-anchor="middle">222</text><line x1="624.0" y1="66" x2="624.0" y2="322" stroke="#15803d" stroke-width="1.8" stroke-dasharray="4 3"/><text class="tick" x="618.0" y="62" text-anchor="end" fill="#15803d">complete = 222</text><text class="lbl" x="200" y="94.7" text-anchor="end">influence profile</text><text class="sub" x="200" y="108.7" text-anchor="end">k numbers</text><rect x="214" y="83.1" width="109.0" height="20.7" fill="#dc2626" rx="2"/><text class="tick" x="332.0" y="98.7" fill="#dc2626">59  (30 collisions)</text><text class="lbl" x="200" y="136.0" text-anchor="end">interaction-order profile</text><text class="sub" x="200" y="150.0" text-anchor="end">k+1 numbers</text><rect x="214" y="124.4" width="265.9" height="20.7" fill="#dc2626" rx="2"/><text class="tick" x="488.9" y="140.0" fill="#dc2626">144  (54 collisions)</text><text class="lbl" x="200" y="177.3" text-anchor="end">the pair (both marginals)</text><text class="sub" x="200" y="191.3" text-anchor="end">2k+1 numbers</text><rect x="214" y="165.8" width="358.3" height="20.7" fill="#dc2626" rx="2"/><text class="tick" x="581.3" y="181.3" fill="#dc2626">194  (15 collisions)</text><text class="lbl" x="200" y="218.7" text-anchor="end">spectrum multiset</text><text class="sub" x="200" y="232.7" text-anchor="end">2^k numbers</text><rect x="214" y="207.1" width="14.8" height="20.7" fill="#dc2626" rx="2"/><text class="tick" x="237.8" y="222.7" fill="#dc2626">8  (8 collisions)</text><text class="lbl" x="200" y="260.0" text-anchor="end">the JOINT matrix M</text><text class="sub" x="200" y="274.0" text-anchor="end">k(k+1) numbers</text><rect x="214" y="248.4" width="400.8" height="20.7" fill="#2563eb" rx="2"/><text class="tick" x="623.8" y="264.0" fill="#2563eb">217  (2 collisions)</text><text class="lbl" x="200" y="301.3" text-anchor="end">matrix + multiset</text><text class="sub" x="200" y="315.3" text-anchor="end">more numbers</text><rect x="214" y="289.8" width="400.8" height="20.7" fill="#2563eb" rx="2"/><text class="tick" x="623.8" y="305.3" fill="#2563eb">217  (2 collisions)</text><text class="sub" x="24" y="350">The spectrum multiset writes down 16 numbers and distinguishes 8 structures. The joint matrix writes down 20 and distinguishes 217.</text><text class="sub" x="24" y="366">Adding the multiset to the matrix changes nothing at all. More numbers is not more information — which numbers is what matters.</text></svg>