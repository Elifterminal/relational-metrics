<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-label="MDL correspondence gain by code">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="700" height="380"/><text class="ttl" x="24" y="26">F-06a MDL correspondence: the order holds, the sign does not</text><text class="sub" x="24" y="43">Compression gain in bits. Above zero = knowing A lets you describe the other structure more cheaply.</text><line class="ax" x1="62" y1="320.0" x2="510" y2="320.0"/><text class="tick" x="53" y="324.0" text-anchor="end">-30</text><line class="ax" x1="62" y1="275.7" x2="510" y2="275.7"/><text class="tick" x="53" y="279.7" text-anchor="end">-20</text><line class="ax" x1="62" y1="231.3" x2="510" y2="231.3"/><text class="tick" x="53" y="235.3" text-anchor="end">-10</text><line class="ax" x1="62" y1="187.0" x2="510" y2="187.0"/><text class="tick" x="53" y="191.0" text-anchor="end">0</text><line class="ax" x1="62" y1="142.7" x2="510" y2="142.7"/><text class="tick" x="53" y="146.7" text-anchor="end">10</text><line class="ax" x1="62" y1="98.3" x2="510" y2="98.3"/><text class="tick" x="53" y="102.3" text-anchor="end">20</text><line class="ax" x1="62" y1="54.0" x2="510" y2="54.0"/><text class="tick" x="53" y="58.0" text-anchor="end">30</text><line x1="62" y1="187.0" x2="510" y2="187.0" stroke="var(--fg)" stroke-width="1.4" opacity="0.7"/><text class="lbl" transform="translate(18,187) rotate(-90)" text-anchor="middle">compression gain (bits)</text><rect x="79.2" y="68.2" width="23.5" height="118.8" fill="#2563eb" rx="2"/><text class="tick" x="91.0" y="63.2" text-anchor="middle">27</text><rect x="107.9" y="99.5" width="23.5" height="87.5" fill="#dc2626" rx="2"/><text class="tick" x="119.7" y="94.5" text-anchor="middle">20</text><rect x="136.7" y="130.4" width="23.5" height="56.6" fill="#d97706" rx="2"/><text class="tick" x="148.4" y="125.4" text-anchor="middle">13</text><rect x="165.4" y="175.0" width="23.5" height="12.0" fill="#64748b" rx="2"/><text class="tick" x="177.2" y="170.0" text-anchor="middle">3</text><text class="lbl" x="136.7" y="340" text-anchor="middle">gamma</text><text class="sub" x="136.7" y="356" text-anchor="middle">B &gt; E &gt; C &gt; D</text><rect x="228.6" y="68.2" width="23.5" height="118.8" fill="#2563eb" rx="2"/><text class="tick" x="240.3" y="63.2" text-anchor="middle">27</text><rect x="257.3" y="104.0" width="23.5" height="83.0" fill="#dc2626" rx="2"/><text class="tick" x="269.1" y="99.0" text-anchor="middle">19</text><rect x="286.0" y="134.9" width="23.5" height="52.1" fill="#d97706" rx="2"/><text class="tick" x="297.8" y="129.9" text-anchor="middle">12</text><rect x="314.7" y="170.6" width="23.5" height="16.4" fill="#64748b" rx="2"/><text class="tick" x="326.5" y="165.6" text-anchor="middle">4</text><text class="lbl" x="286.0" y="340" text-anchor="middle">delta</text><text class="sub" x="286.0" y="356" text-anchor="middle">B &gt; E &gt; C &gt; D</text><rect x="377.9" y="187.0" width="23.5" height="36.4" fill="#2563eb" rx="2"/><text class="tick" x="389.7" y="236.4" text-anchor="middle">-8</text><rect x="406.6" y="187.0" width="23.5" height="58.8" fill="#dc2626" rx="2"/><text class="tick" x="418.4" y="258.8" text-anchor="middle">-13</text><rect x="435.3" y="187.0" width="23.5" height="89.7" fill="#d97706" rx="2"/><text class="tick" x="447.1" y="289.7" text-anchor="middle">-20</text><rect x="464.1" y="187.0" width="23.5" height="116.6" fill="#64748b" rx="2"/><text class="tick" x="475.8" y="316.6" text-anchor="middle">-26</text><text class="lbl" x="435.3" y="340" text-anchor="middle">flat32</text><text class="sub" x="435.3" y="356" text-anchor="middle">B &gt; E &gt; C &gt; D</text><rect x="532" y="51" width="14" height="12" fill="#2563eb" rx="2"/><text class="lbl" x="552" y="61">B</text><text class="sub" x="568" y="61">different surface, same structure</text><rect x="532" y="73" width="14" height="12" fill="#dc2626" rx="2"/><text class="lbl" x="552" y="83">E</text><text class="sub" x="568" y="83">near-miss, one edge flipped</text><rect x="532" y="95" width="14" height="12" fill="#d97706" rx="2"/><text class="lbl" x="552" y="105">C</text><text class="sub" x="568" y="105">same surface, different structure</text><rect x="532" y="117" width="14" height="12" fill="#64748b" rx="2"/><text class="lbl" x="552" y="127">D</text><text class="sub" x="568" y="127">matched random</text><text class="sub" x="532" y="164">Ranking identical under all</text><text class="sub" x="532" y="180">three codes. But flat32 puts</text><text class="sub" x="532" y="196">every pair below zero — it</text><text class="sub" x="532" y="212">rejects even the true analogue.</text><text class="sub" x="532" y="228">Order is robust. The accept/</text><text class="sub" x="532" y="244">reject line is not.</text><text class="lbl" x="286" y="368" text-anchor="middle">description-length code</text></svg>