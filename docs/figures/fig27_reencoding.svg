<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="Representation invariance">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="430"/><text class="ttl" x="24" y="26">The same process, written down differently</text><text class="sub" x="24" y="45">Blue: re-encodings that change nothing about the process. Red: changes that alter what is being claimed.</text><text class="sub" x="24" y="62">If the measure saw the process, every blue bar would sit right of every red one.</text><line x1="651.3" y1="84" x2="651.3" y2="340.0" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 3"/><text class="tick" x="651.3" y="78" text-anchor="middle">identical copy (1.98)</text><text class="lbl" x="178" y="108.1" text-anchor="end">relabel</text><rect x="190" y="96.8" width="461.3" height="14.5" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="659.3" y="108.1" font-family="monospace">1.9769</text><text class="lbl" x="178" y="132.3" text-anchor="end">retype</text><rect x="190" y="121.0" width="461.3" height="14.5" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="659.3" y="132.3" font-family="monospace">1.9769</text><text class="lbl" x="178" y="156.5" text-anchor="end">delete_one</text><rect x="190" y="145.2" width="165.4" height="14.5" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="363.4" y="156.5" font-family="monospace">1.3503</text><text class="lbl" x="178" y="180.7" text-anchor="end">mediate_one</text><rect x="190" y="169.4" width="157.9" height="14.5" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="355.9" y="180.7" font-family="monospace">1.3343</text><text class="lbl" x="178" y="204.9" text-anchor="end">reverse_one</text><rect x="190" y="193.6" width="120.3" height="14.5" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="318.3" y="204.9" font-family="monospace">1.2547</text><text class="lbl" x="178" y="229.1" text-anchor="end">converse</text><rect x="190" y="217.8" width="114.7" height="14.5" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="312.7" y="229.1" font-family="monospace">1.2429</text><text class="lbl" x="178" y="253.3" text-anchor="end">reify_one</text><rect x="190" y="242.0" width="96.9" height="14.5" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="294.9" y="253.3" font-family="monospace">1.2051</text><text class="lbl" x="178" y="277.5" text-anchor="end">flip_type_one</text><rect x="190" y="266.2" width="93.5" height="14.5" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="291.5" y="277.5" font-family="monospace">1.1980</text><text class="lbl" x="178" y="301.7" text-anchor="end">rewire_one</text><rect x="190" y="290.4" width="89.0" height="14.5" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="287.0" y="301.7" font-family="monospace">1.1884</text><text class="lbl" x="178" y="325.9" text-anchor="end">subdivide_all</text><rect x="190" y="314.6" width="58.6" height="14.5" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="256.6" y="325.9" font-family="monospace">1.1240</text><text class="sub" x="24" y="356.0" fill="#dc2626">They overlap. &quot;subdivide_all&quot; changes nothing and scores BELOW &quot;delete_one&quot;, which changes the process.</text><text class="sub" x="24" y="374.0">Size is not the explanation: subdividing BOTH sides, the measure separates correct from corrupted on 0 of 6 —</text><text class="sub" x="24" y="388.0">it returns the identical number for both, and the two structures are not isomorphic. Blind, not merely biased.</text><text class="sub" x="24" y="408.0" fill="#d97706">Cost to the headline claim: holds 6/6 under renaming, 3/6 in the passive voice, 2/6 under subdivision.</text></svg>