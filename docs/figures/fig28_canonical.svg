<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Canonicalisation">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">Declare the equivalence, then measure through it</text><text class="sub" x="24" y="45">Same transforms as the previous figure, but both sides are put in canonical form first.</text><text class="sub" x="24" y="62">Blue = same process, in the declared class. Grey = same process, no rewrite declared. Red = different process.</text><text class="lbl" x="168" y="110.8" text-anchor="end">relabel</text><rect x="180" y="100.3" width="443.1" height="13.0" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="631.1" y="110.8" font-family="monospace">1.9769</text><text class="lbl" x="168" y="132.4" text-anchor="end">retype</text><rect x="180" y="121.9" width="443.1" height="13.0" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="631.1" y="132.4" font-family="monospace">1.9769</text><text class="lbl" x="168" y="154.0" text-anchor="end">mediate_one</text><rect x="180" y="143.5" width="443.1" height="13.0" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="631.1" y="154.0" font-family="monospace">1.9769   6/6 exact</text><text class="lbl" x="168" y="175.6" text-anchor="end">subdivide_all</text><rect x="180" y="165.1" width="443.1" height="13.0" fill="#2563eb" rx="2" opacity="0.9"/><text class="tick" x="631.1" y="175.6" font-family="monospace">1.9769   6/6 exact</text><text class="lbl" x="168" y="197.2" text-anchor="end">delete_one</text><rect x="180" y="186.7" width="158.9" height="13.0" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="346.9" y="197.2" font-family="monospace">1.3503</text><text class="lbl" x="168" y="218.8" text-anchor="end">reverse_one</text><rect x="180" y="208.3" width="115.5" height="13.0" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="303.5" y="218.8" font-family="monospace">1.2547</text><text class="lbl" x="168" y="240.4" text-anchor="end">converse</text><rect x="180" y="229.9" width="110.2" height="13.0" fill="#94a3b8" rx="2" opacity="0.9"/><text class="tick" x="298.2" y="240.4" font-family="monospace">1.2429</text><text class="lbl" x="168" y="262.0" text-anchor="end">reify_one</text><rect x="180" y="251.5" width="93.0" height="13.0" fill="#94a3b8" rx="2" opacity="0.9"/><text class="tick" x="281.0" y="262.0" font-family="monospace">1.2051</text><text class="lbl" x="168" y="283.6" text-anchor="end">flip_type_one</text><rect x="180" y="273.1" width="89.8" height="13.0" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="277.8" y="283.6" font-family="monospace">1.1980</text><text class="lbl" x="168" y="305.2" text-anchor="end">rewire_one</text><rect x="180" y="294.7" width="85.4" height="13.0" fill="#dc2626" rx="2" opacity="0.9"/><text class="tick" x="273.4" y="305.2" font-family="monospace">1.1884</text><text class="sub" x="24" y="336.0" fill="#2563eb">Subdivision and mediation now cost NOTHING — identical to comparing a structure with itself, and structurally exact.</text><text class="sub" x="24" y="352.0">The main claim survives it: 3/3, 3/3, 4/4 on subdivided documents — the case that scored 2 of 6 before.</text><text class="sub" x="24" y="370.0" fill="#64748b">Grey bars are the honest gap: converse, reify_one are legitimate re-encodings with no declared rewrite yet.</text><text class="sub" x="24" y="388.0" fill="#d97706">And the equivalence must be DECLARED: suppressing blindly damages 5 of 6 structures, because "is this vertex real?" is not a question structure can answer.</text></svg>