<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 988 450" width="988" height="450" role="img" aria-label="Harness self-test matrix">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="988" height="450"/><text class="ttl" x="24" y="26">Harness self-test: can the laboratory catch a cheat?</text><text class="sub" x="24" y="43">Seven deliberately fake methods and three real candidates, against six controls. A method is admitted only by passing all six.</text><text class="sub" x="244" y="74" text-anchor="middle">C1 ranks</text><text class="sub" x="244" y="86" text-anchor="middle">true analogue</text><text class="sub" x="352" y="74" text-anchor="middle">C2 sees past</text><text class="sub" x="352" y="86" text-anchor="middle">vocabulary</text><text class="sub" x="460" y="74" text-anchor="middle">C3 rejects</text><text class="sub" x="460" y="86" text-anchor="middle">random</text><text class="sub" x="568" y="74" text-anchor="middle">C4 discriminates</text><text class="sub" x="568" y="86" text-anchor="middle">at all</text><text class="sub" x="676" y="74" text-anchor="middle">C5 held-out</text><text class="sub" x="676" y="86" text-anchor="middle">structure</text><text class="sub" x="784" y="74" text-anchor="middle">C6 rejects</text><text class="sub" x="784" y="86" text-anchor="middle">superset</text><rect x="14" y="95" width="948" height="28" fill="var(--fg)" opacity="0.035"/><text class="lbl" x="174" y="115" text-anchor="end" fill="#dc2626">name_reader</text><circle cx="244" cy="111" r="8.5" fill="#dc2626" opacity="0.88"/><text x="244" y="114" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><circle cx="352" cy="111" r="8.5" fill="#dc2626" opacity="0.88"/><text x="352" y="114" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><circle cx="460" cy="111" r="8.5" fill="#dc2626" opacity="0.88"/><text x="460" y="114" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><circle cx="568" cy="111" r="8.5" fill="#15803d" opacity="0.88"/><text x="568" y="114" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">OK</text><circle cx="67