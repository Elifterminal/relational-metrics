<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Asymmetric families">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="380"/><text class="ttl" x="24" y="26">Asymmetric families — retention is a range, not a point</text><text class="sub" x="24" y="45">Each dot is one participant. The blue marker is what a best-case summary would have reported.</text><line class="ax" x1="168.0" y1="62" x2="168.0" y2="320"/><text class="tick" x="168.0" y="338" text-anchor="middle">0.0</text><line class="ax" x1="256.4" y1="62" x2="256.4" y2="320"/><text class="tick" x="256.4" y="338" text-anchor="middle">0.2</text><line class="ax" x1="344.8" y1="62" x2="344.8" y2="320"/><text class="tick" x="344.8" y="338" text-anchor="middle">0.4</text><line class="ax" x1="433.2" y1="62" x2="433.2" y2="320"/><text class="tick" x="433.2" y="338" text-anchor="middle">0.6</text><line class="ax" x1="521.6" y1="62" x2="521.6" y2="320"/><text class="tick" x="521.6" y="338" text-anchor="middle">0.8</text><line class="ax" x1="610.0" y1="62" x2="610.0" y2="320"/><text class="tick" x="610.0" y="338" text-anchor="middle">1.0</text><text class="lbl" x="389" y="366" text-anchor="middle">information retained after losing that participant</text><text class="lbl" x="154" y="95.4" text-anchor="end">and_or</text><line x1="262.7" y1="91.4" x2="494.2" y2="91.4" stroke="var(--fg)" stroke-width="2" opacity="0.3"/><circle cx="262.7" cy="91.4" r="5" fill="#64748b"/><circle cx="494.2" cy="91.4" r="5" fill="#64748b"/><circle cx="494.2" cy="91.4" r="5" fill="#64748b"/><circle cx="494.2" cy="91.4" r="7" fill="none" stroke="#2563eb" stroke-width="2.2"/><text class="tick" x="624" y="95.4" fill="var(--mut)">spread 0.524</text><text class="lbl" x="154" y="146.2" text-anchor="end">xor_and</text><line x1="168.0" y1="142.2" x2="389.0" y2="142.2" stroke="var(--fg)" stroke-width="2" opacity="0.3"/><circle cx="168.0" cy="142.2" r="5" fill="#dc2626"/><circle cx="389.0" cy="142.2" r="5" fill="#64748b"/><circle cx="389.0" cy="142.2" r="5" fill="#64748b"/><circle cx="389.0" cy="142.2" r="7" fill="none" stroke="#2563eb" stroke-width="2.2"/><text class="tick" x="624" y="146.2" fill="var(--mut)">spread 0.500</text><text class="lbl" x="154" y="197.0" text-anchor="end">mux</text><circle cx="389.0" cy="193.0" r="5" fill="#64748b"/><circle cx="389.0" cy="193.0" r="5" fill="#64748b"/><circle cx="389.0" cy="193.0" r="5" fill="#64748b"/><circle cx="389.0" cy="193.0" r="7" fill="none" stroke="#2563eb" stroke-width="2.2"/><text class="tick" x="624" y="197.0" fill="#15803d">influence-symmetric — spread 0</text><text class="lbl" x="154" y="247.8" text-anchor="end">graded_k4</text><line x1="301.7" y1="243.8" x2="548.3" y2="243.8" stroke="var(--fg)" stroke-width="2" opacity="0.3"/><circle cx="301.7" cy="243.8" r="5" fill="#64748b"/><circle cx="425.0" cy="243.8" r="5" fill="#64748b"/><circle cx="548.3" cy="243.8" r="5" fill="#64748b"/><circle cx="548.3" cy="243.8" r="5" fill="#64748b"/><circle cx="548.3" cy="243.8" r="7" fill="none" stroke="#2563eb" stroke-width="2.2"/><text class="tick" x="624" y="247.8" fill="var(--mut)">spread 0.558</text><text class="lbl" x="154" y="298.6" text-anchor="end">xor_cascade_k4</text><line x1="168.0" y1="294.6" x2="499.5" y2="294.6" stroke="var(--fg)" stroke-width="2" opacity="0.3"/><circle cx="168.0" cy="294.6" r="5" fill="#dc2626"/><circle cx="278.5" cy="294.6" r="5" fill="#64748b"/><circle cx="499.5" cy="294.6" r="5" fill="#64748b"/><circle cx="499.5" cy="294.6" r="5" fill="#64748b"/><circle cx="499.5" cy="294.6" r="7" fill="none" stroke="#2563eb" stroke-width="2.2"/><text class="tick" x="624" y="298.6" fill="var(--mut)">spread 0.750</text><text class="sub" x="24" y="342">Red dots are total loss. Two families VANISH if you lose one particular participant while retaining half or three quarters</text><text class="sub" x="24" y="356">if you lose any other. `mux` is the control: not permutation-symmetric at all, yet every participant matters equally — which is why</text><text class="sub" x="24" y="370">the property that matters is INFLUENCE-symmetry, not permutation-symmetry.</text></svg>