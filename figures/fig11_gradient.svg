<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Retention gradient">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">The cliff is the endpoint of a gradient, not a wall</text><text class="sub" x="24" y="44">Information retained after hiding one participant, as that participant goes from irrelevant to essential.</text><line class="ax" x1="62" y1="342.0" x2="550" y2="342.0"/><text class="tick" x="53" y="346.0" text-anchor="end">0.0</text><line class="ax" x1="62" y1="286.0" x2="550" y2="286.0"/><text class="tick" x="53" y="290.0" text-anchor="end">0.2</text><line class="ax" x1="62" y1="230.0" x2="550" y2="230.0"/><text class="tick" x="53" y="234.0" text-anchor="end">0.4</text><line class="ax" x1="62" y1="174.0" x2="550" y2="174.0"/><text class="tick" x="53" y="178.0" text-anchor="end">0.6</text><line class="ax" x1="62" y1="118.0" x2="550" y2="118.0"/><text class="tick" x="53" y="122.0" text-anchor="end">0.8</text><line class="ax" x1="62" y1="62.0" x2="550" y2="62.0"/><text class="tick" x="53" y="66.0" text-anchor="end">1.0</text><text class="tick" x="62.0" y="360" text-anchor="middle">0.0</text><text class="tick" x="159.6" y="360" text-anchor="middle">0.2</text><text class="tick" x="257.2" y="360" text-anchor="middle">0.4</text><text class="tick" x="354.8" y="360" text-anchor="middle">0.6</text><text class="tick" x="452.4" y="360" text-anchor="middle">0.8</text><text class="tick" x="550.0" y="360" text-anchor="middle">1.0</text><text class="lbl" x="306" y="386" text-anchor="middle">how often the hidden participant actually matters</text><text class="lbl" transform="translate(18,202) rotate(-90)" text-anchor="middle">information retained</text><polyline points="62.0,62.1 159.6,92.3 257.2,173.9 354.8,270.1 452.4,327.8 550.0,342.0" fill="none" stroke="#2563eb" stroke-width="2.6"/><circle cx="62.0" cy="62.1" r="4" fill="#2563eb"/><text class="tick" x="62.0" y="51.1" text-anchor="middle">1.00</text><circle cx="159.6" cy="92.3" r="4" fill="#2563eb"/><text class="tick" x="159.6" y="81.3" text-anchor="middle">0.89</text><circle cx="257.2" cy="173.9" r="4" fill="#2563eb"/><text class="tick" x="257.2" y="162.9" text-anchor="middle">0.60</text><circle cx="354.8" cy="270.1" r="4" fill="#2563eb"/><text class="tick" x="354.8" y="259.1" text-anchor="middle">0.26</text><circle cx="452.4" cy="327.8" r="4" fill="#2563eb"/><text class="tick" x="452.4" y="316.8" text-anchor="middle">0.05</text><circle cx="550.0" cy="342.0" r="4" fill="#2563eb"/><text class="tick" x="550.0" y="331.0" text-anchor="middle">0.00</text><rect x="62" y="178.1" width="488" height="24.9" fill="#15803d" opacity="0.10"/><text class="sub" x="70" y="172.1" fill="#15803d">where AND / OR / majority / threshold actually sit</text><text class="sub" x="572" y="72">parity is the ONLY structure</text><text class="sub" x="572" y="88">that vanishes completely.</text><text class="sub" x="572" y="104">It is built so no subset</text><text class="sub" x="572" y="120">carries any information —</text><text class="sub" x="572" y="136">the worst case, by</text><text class="sub" x="572" y="152">construction.</text><text class="sub" x="572" y="168"></text><text class="sub" x="572" y="184">Everything with lower-order</text><text class="sub" x="572" y="200">leakage keeps roughly half</text><text class="sub" x="572" y="216">of what it had.</text></svg>