<rect class="bg" width="800" height="450"/><text class="ttl" x="24" y="26">What the representation cannot tell apart — tested in advance</text><text class="sub" x="24" y="45">A witness pair is two cases needing DIFFERENT answers whose structures are the same. One such pair proves</text><text class="sub" x="24" y="61">no measure on that representation can ever work. Not "has not yet" — cannot.</text><text class="lbl" x="24" y="92">distinction wanted</text><text class="lbl" x="480" y="92">verdict</text><text class="lbl" x="620" y="92">channel it would need</text><rect x="24" y="120" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="139">genuine analogue vs vacuous restatement</text><text class="tick" x="480" y="139" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="139" fill="var(--mut)">specificity / referentia…</text><rect x="24" y="154" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="173">real participant vs inserted mediator</text><text class="tick" x="480" y="173" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="173" fill="var(--mut)">ontological role declara…</text><rect x="24" y="188" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="207">strong coupling vs negligible coupling</text><text class="tick" x="480" y="207" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="207" fill="var(--mut)">magnitude channel (weigh…</text><rect x="24" y="222" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="241">reinforcing vs regulating by DELAY, same static graph</text><text class="tick" x="480" y="241" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="241" fill="var(--mut)">temporal channel (order …</text><rect x="24" y="256" width="752" height="28" fill="#dc2626" opacity="0.07" rx="3"/><text class="tick" x="34" y="275">asserted claim vs empirically observed relation</text><text class="tick" x="480" y="275" fill="#dc2626" font-weight="600">NOT IDENTIFIABLE</text><text class="tick" x="620" y="275" fill="var(--mut)">provenance / evidence ch…</text><rect x="24" y="290" width="752" height="28" fill="#15803d" opacity="0.07" rx="3"/><text class="tick" x="34" y="309">reinforcing vs balancing loop (CONTROL -- should be …</text><text class="tick" x="480" y="309" fill="#15803d" font-weight="600">identifiable</text><text class="tick" x="620" y="309" fill="var(--mut)">none needed</text><text class="sub" x="24" y="346">5 of 6 are provably outside the current representation. The last row is a CONTROL — it comes back</text><text class="sub" x="24" y="361">identifiable, which is how you know the audit can return both answers. A test with only one possible result is not a test.</text><text class="sub" x="24" y="383" fill="#dc2626">Found by this audit, unpaid for: coupling strength differing 1000x scores 1.3778 — identical to comparing a structure with itself.</text><text class="sub" x="24" y="398" fill="#d97706">The very first experiment has published "invariant to unit conversion" ever since. It cannot fail: the measure never reads weights.</text></svg>