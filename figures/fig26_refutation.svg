<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Retraction and refutation">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">A retraction, and why the planned fix cannot work</text><text class="sub" x="24" y="45">Left: what was published vs what is true. Right: the discount that was supposed to fix it.</text><text class="lbl" x="24" y="80">PUBLISHED</text><text class="sub" x="24" y="100" fill="#dc2626">"the vacuous document beats the genuine analogue on 3 of 4"</text><text class="lbl" x="24" y="130">TRUE</text><text class="sub" x="24" y="150" fill="#15803d">they score identically on 4 of 4 — equal in the last bit</text><text class="tick" x="24" y="178">motif</text><text class="tick" x="150" y="178">paraphrase</text><text class="tick" x="252" y="178">analogue</text><text class="tick" x="340" y="178">generic</text><text class="tick" x="24" y="198">diversity</text><text class="tick" x="150" y="198" font-family="monospace">2.142279</text><text class="tick" x="245" y="198" font-family="monospace">2.142279</text><text class="tick" x="340" y="198" font-family="monospace">2.142279</text><text class="tick" x="24" y="216">correction</text><text class="tick" x="150" y="216" font-family="monospace">1.989754</text><text class="tick" x="245" y="216" font-family="monospace">1.989754</text><text class="tick" x="340" y="216" font-family="monospace">1.989754</text><text class="tick" x="24" y="234">regulator</text><text class="tick" x="150" y="234" font-family="monospace">1.881612</text><text class="tick" x="245" y="234" font-family="monospace">1.881612</text><text class="tick" x="340" y="234" font-family="monospace">1.881612</text><text class="tick" x="24" y="252">rivalry</text><text class="tick" x="150" y="252" font-family="monospace">2.291232</text><text class="tick" x="245" y="252" font-family="monospace">2.291232</text><text class="tick" x="340" y="252" font-family="monospace">2.291232</text><text class="sub" x="24" y="286">The ordering came from a tie-break on a hash that is randomised every run.</text><line x1="446" y1="66" x2="446" y2="370" stroke="#94a3b8" stroke-width="1" opacity="0.5"/><text class="lbl" x="470" y="80">THE PLANNED FIX</text><text class="sub" x="470" y="100" font-family="monospace">bridge = match − genericness</text><text class="sub" x="470" y="124">discount things that match everything</text><text class="lbl" x="470" y="156">IT CANNOT SEPARATE THEM</text><text class="tick" x="470" y="178">motif</text><text class="tick" x="566" y="178">gen(analogue)</text><text class="tick" x="662" y="178">gen(generic)</text><text class="tick" x="470" y="198">diversity</text><text class="tick" x="566" y="198" font-family="monospace">1.2375</text><text class="tick" x="662" y="198" font-family="monospace">1.2375</text><text class="tick" x="470" y="216">correction</text><text class="tick" x="566" y="216" font-family="monospace">1.0425</text><text class="tick" x="662" y="216" font-family="monospace">1.0425</text><text class="tick" x="470" y="234">regulator</text><text class="tick" x="566" y="234" font-family="monospace">1.0750</text><text class="tick" x="662" y="234" font-family="monospace">1.0750</text><text class="tick" x="470" y="252">rivalry</text><text class="tick" x="566" y="252" font-family="monospace">1.0537</text><text class="tick" x="662" y="252" font-family="monospace">1.0537</text><text class="sub" x="470" y="286" fill="#dc2626">Gap = 0.00e+00 on every motif.</text><text class="sub" x="470" y="302">The generic is ISOMORPHIC to the query, so any</text><text class="sub" x="470" y="316">measure of structure alone must score them equal.</text><text class="sub" x="470" y="332" fill="#dc2626">No strength of discount can work. Arithmetic, not tuning.</text></svg>