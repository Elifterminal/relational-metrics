<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="External benchmark">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">A benchmark nobody here touched — and what it actually tested</text><text class="sub" x="24" y="45">20 items, ground truth from outside, every passage annotated blind to its role and sealed before the answers were readable.</text><text class="lbl" x="24" y="86">THREE HONEST READINGS</text><text class="tick" x="190" y="117" text-anchor="end">ties counted wrong</text><rect x="200" y="106" width="250" height="15" fill="var(--bd)" rx="2"/><rect x="200" y="106" width="50.0" height="15" fill="#94a3b8" rx="2"/><text class="tick" x="460" y="117" font-family="monospace">20%  p=0.01</text><text class="tick" x="190" y="147" text-anchor="end">ties as coin flips</text><rect x="200" y="136" width="250" height="15" fill="var(--bd)" rx="2"/><rect x="200" y="136" width="106.2" height="15" fill="#2563eb" rx="2"/><text class="tick" x="460" y="147" font-family="monospace">42%  p=0.50</text><text class="tick" x="190" y="177" text-anchor="end">where it discriminates</text><rect x="200" y="166" width="250" height="15" fill="var(--bd)" rx="2"/><rect x="200" y="166" width="90.9" height="15" fill="#2563eb" rx="2"/><text class="tick" x="460" y="177" font-family="monospace">36%  p=0.55</text><line x1="325" y1="100" x2="325" y2="196" stroke="var(--mut)" stroke-dasharray="3 3"/><text class="tick" x="325" y="96" text-anchor="middle">chance</text><text class="sub" x="24" y="212">The measure ABSTAINS on 9 of 20 items — exact ties. On both honest readings this is chance.</text><text class="sub" x="24" y="228" fill="#64748b">The 20% reading looks significant and would say anti-correlation, which the data does not support. A tie is an abstention.</text><text class="lbl" x="24" y="266">WHOSE FAILURE? Strip the scoring entirely and just count matching relations:</text><text class="tick" x="190" y="297" text-anchor="end">annotation favours the RIGHT answer</text><rect x="200" y="286" width="37.5" height="14" fill="#15803d" rx="2"/><text class="tick" x="245.5" y="297" font-family="monospace">3/20</text><text class="tick" x="190" y="319" text-anchor="end">no difference at all</text><rect x="200" y="308" width="162.5" height="14" fill="#94a3b8" rx="2"/><text class="tick" x="370.5" y="319" font-family="monospace">13/20</text><text class="tick" x="190" y="341" text-anchor="end">annotation favours the DISTRACTOR</text><rect x="200" y="330" width="50.0" height="14" fill="#dc2626" rx="2"/><text class="tick" x="258.0" y="341" font-family="monospace">4/20</text><text class="sub" x="24" y="370" fill="#dc2626">Chance. The distinction is not in the annotation, so the measure had nothing to work with — this tested the ANNOTATOR.</text></svg>