<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Independent corpus">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="360"/><text class="ttl" x="24" y="26">A corpus nobody involved in this project wrote</text><text class="sub" x="24" y="45">Commissioned with a format spec only — no hint of what was being tested. Frozen before it was run. Measure unchanged.</text><rect x="24" y="57" width="11" height="10" fill="#2563eb" rx="2"/><text class="sub" x="40" y="66">P paraphrase</text><rect x="174" y="57" width="11" height="10" fill="#15803d" rx="2"/><text class="sub" x="190" y="66">X analogue</text><rect x="324" y="57" width="11" height="10" fill="#dc2626" rx="2"/><text class="sub" x="340" y="66">W false friend</text><rect x="474" y="57" width="11" height="10" fill="#d97706" rx="2"/><text class="sub" x="490" y="66">V generic</text><rect x="624" y="57" width="11" height="10" fill="#94a3b8" rx="2"/><text class="sub" x="640" y="66">U unrelated</text><text class="lbl" x="136" y="125.8" text-anchor="end">diversity</text><rect x="150.0" y="106.3" width="90.8" height="30.9" fill="#2563eb" rx="2" opacity="0.35"/><text x="196.4" y="125.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="246.8" y="106.3" width="90.8" height="30.9" fill="#d97706" rx="2" opacity="0.95"/><text x="293.2" y="125.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="343.6" y="106.3" width="90.8" height="30.9" fill="#15803d" rx="2" opacity="0.95"/><text x="390.0" y="125.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="440.4" y="106.3" width="90.8" height="30.9" fill="#94a3b8" rx="2" opacity="0.35"/><text x="486.8" y="125.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><rect x="537.2" y="106.3" width="90.8" height="30.9" fill="#dc2626" rx="2" opacity="0.95"/><text x="583.6" y="125.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><text class="tick" x="642" y="125.8" fill="#15803d">X &gt; W</text><text class="lbl" x="136" y="177.2" text-anchor="end">correction</text><rect x="150.0" y="157.8" width="90.8" height="30.9" fill="#d97706" rx="2" opacity="0.95"/><text x="196.4" y="177.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="246.8" y="157.8" width="90.8" height="30.9" fill="#2563eb" rx="2" opacity="0.35"/><text x="293.2" y="177.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="343.6" y="157.8" width="90.8" height="30.9" fill="#15803d" rx="2" opacity="0.95"/><text x="390.0" y="177.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="440.4" y="157.8" width="90.8" height="30.9" fill="#dc2626" rx="2" opacity="0.95"/><text x="486.8" y="177.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><rect x="537.2" y="157.8" width="90.8" height="30.9" fill="#94a3b8" rx="2" opacity="0.35"/><text x="583.6" y="177.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><text class="tick" x="642" y="177.2" fill="#15803d">X &gt; W</text><text class="lbl" x="136" y="228.8" text-anchor="end">regulator</text><rect x="150.0" y="209.3" width="90.8" height="30.9" fill="#2563eb" rx="2" opacity="0.35"/><text x="196.4" y="228.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="246.8" y="209.3" width="90.8" height="30.9" fill="#d97706" rx="2" opacity="0.95"/><text x="293.2" y="228.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="343.6" y="209.3" width="90.8" height="30.9" fill="#15803d" rx="2" opacity="0.95"/><text x="390.0" y="228.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="440.4" y="209.3" width="90.8" height="30.9" fill="#dc2626" rx="2" opacity="0.95"/><text x="486.8" y="228.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><rect x="537.2" y="209.3" width="90.8" height="30.9" fill="#94a3b8" rx="2" opacity="0.35"/><text x="583.6" y="228.8" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><text class="tick" x="642" y="228.8" fill="#15803d">X &gt; W</text><text class="lbl" x="136" y="280.2" text-anchor="end">rivalry</text><rect x="150.0" y="260.8" width="90.8" height="30.9" fill="#15803d" rx="2" opacity="0.95"/><text x="196.4" y="280.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">X</text><rect x="246.8" y="260.8" width="90.8" height="30.9" fill="#2563eb" rx="2" opacity="0.35"/><text x="293.2" y="280.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">P</text><rect x="343.6" y="260.8" width="90.8" height="30.9" fill="#d97706" rx="2" opacity="0.95"/><text x="390.0" y="280.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">V</text><rect x="440.4" y="260.8" width="90.8" height="30.9" fill="#dc2626" rx="2" opacity="0.95"/><text x="486.8" y="280.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">W</text><rect x="537.2" y="260.8" width="90.8" height="30.9" fill="#94a3b8" rx="2" opacity="0.35"/><text x="583.6" y="280.2" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">U</text><text class="tick" x="642" y="280.2" fill="#15803d">X &gt; W</text><text class="sub" x="24" y="320">Analogue beats false friend on all four — the claim holds on annotations nobody here produced. And paraphrase and analogue</text><text class="sub" x="24" y="334">score IDENTICALLY on all four again, which is the vocabulary-blindness signature confirmed independently.</text><text class="sub" x="24" y="350" fill="#d97706">But the GENERIC document outranks the analogue on three of four — and it is structurally right to. See below.</text></svg>