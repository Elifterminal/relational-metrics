<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Retention census">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">All 256 Boolean functions of three variables, computed exactly</text><text class="sub" x="24" y="45">Retention takes only SEVEN distinct values. It is quantised, not continuous — and one half is a real class.</text><line class="ax" x1="70" y1="334.0" x2="590" y2="334.0"/><text class="tick" x="61" y="338.0" text-anchor="end">0</text><line class="ax" x1="70" y1="267.0" x2="590" y2="267.0"/><text class="tick" x="61" y="271.0" text-anchor="end">24</text><line class="ax" x1="70" y1="200.0" x2="590" y2="200.0"/><text class="tick" x="61" y="204.0" text-anchor="end">48</text><line class="ax" x1="70" y1="133.0" x2="590" y2="133.0"/><text class="tick" x="61" y="137.0" text-anchor="end">72</text><line class="ax" x1="70" y1="66.0" x2="590" y2="66.0"/><text class="tick" x="61" y="70.0" text-anchor="end">96</text><text class="lbl" transform="translate(22,200) rotate(-90)" text-anchor="middle">how many functions</text><text class="lbl" x="330" y="388" text-anchor="middle">information retained after hiding one participant</text><rect x="81.9" y="328.4" width="50.5" height="5.6" fill="#dc2626" rx="2"/><text class="tick" x="107.1" y="322.4" text-anchor="middle">2</text><text class="lbl" x="107.1" y="354" text-anchor="middle">0.000</text><text class="sub" x="107.1" y="370" text-anchor="middle" fill="#dc2626">parity only</text><rect x="156.2" y="289.3" width="50.5" height="44.7" fill="#94a3b8" rx="2"/><text class="tick" x="181.4" y="283.3" text-anchor="middle">16</text><text class="lbl" x="181.4" y="354" text-anchor="middle">0.214</text><rect x="230.5" y="244.7" width="50.5" height="89.3" fill="#94a3b8" rx="2"/><text class="tick" x="255.7" y="238.7" text-anchor="middle">32</text><text class="lbl" x="255.7" y="354" text-anchor="middle">0.384</text><rect x="304.7" y="177.7" width="50.5" height="156.3" fill="#2563eb" rx="2"/><text class="tick" x="330.0" y="171.7" text-anchor="middle">56</text><text class="lbl" x="330.0" y="354" text-anchor="middle">0.500</text><text class="sub" x="330.0" y="370" text-anchor="middle" fill="#2563eb">balanced</text><rect x="379.0" y="289.3" width="50.5" height="44.7" fill="#94a3b8" rx="2"/><text class="tick" x="404.3" y="283.3" text-anchor="middle">16</text><text class="lbl" x="404.3" y="354" text-anchor="middle">0.540</text><text class="sub" x="404.3" y="370" text-anchor="middle" fill="#94a3b8">AND / OR</text><rect x="453.3" y="66.0" width="50.5" height="268.0" fill="#94a3b8" rx="2"/><text class="tick" x="478.6" y="60.0" text-anchor="middle">96</text><text class="lbl" x="478.6" y="354" text-anchor="middle">0.738</text><rect x="527.6" y="233.5" width="50.5" height="100.5" fill="#94a3b8" rx="2"/><text class="tick" x="552.9" y="227.5" text-anchor="middle">36</text><text class="lbl" x="552.9" y="354" text-anchor="middle">1.000</text><text class="sub" x="552.9" y="370" text-anchor="middle" fill="#94a3b8">one input idle</text><text class="sub" x="610" y="78">0.500 is a REAL class:</text><text class="sub" x="610" y="93">56 functions, every one of</text><text class="sub" x="610" y="108">them balanced (four ones</text><text class="sub" x="610" y="123">in its truth table).</text><text class="sub" x="610" y="138">Majority is one of them.</text><text class="sub" x="610" y="153"></text><text class="sub" x="610" y="168">But AND and OR sit at</text><text class="sub" x="610" y="183">0.540 — a DIFFERENT class.</text><text class="sub" x="610" y="198">They only looked like 0.5</text><text class="sub" x="610" y="213">because 5% noise pulled</text><text class="sub" x="610" y="228">them there.</text><text class="sub" x="610" y="243"></text><text class="sub" x="610" y="258">Parity alone reaches zero.</text></svg>