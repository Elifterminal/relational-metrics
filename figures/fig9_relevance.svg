<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Structure versus relevance">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">Structure is objective. Relevance is not.</text><text class="sub" x="24" y="44">Bar length is the raw connected information — how much structure is there. Colour is whether it survives shuffling the outcome.</text><text class="lbl" x="198" y="83.6" text-anchor="end">driver_only_3way  ·  I_C(3)</text><rect x="210" y="69.0" width="380.6" height="21.1" fill="#94a3b8" rx="2"/><text class="tick" x="599.6" y="83.6" fill="#94a3b8">0.9994  —  NOT about the outcome</text><text class="lbl" x="198" y="118.9" text-anchor="end">driver_only_pairwise  ·  I_C(2)</text><rect x="210" y="104.3" width="380.8" height="21.1" fill="#94a3b8" rx="2"/><text class="tick" x="599.8" y="118.9" fill="#94a3b8">1.0000  —  NOT about the outcome</text><text class="lbl" x="198" y="154.1" text-anchor="end">mixed  ·  I_C(3)</text><rect x="210" y="139.6" width="268.9" height="21.1" fill="#2563eb" rx="2"/><text class="tick" x="487.9" y="154.1" fill="#2563eb">0.7060  —  about the outcome</text><text class="lbl" x="198" y="189.4" text-anchor="end">mixed  ·  I_C(2)</text><rect x="210" y="174.8" width="381.0" height="21.1" fill="#94a3b8" rx="2"/><text class="tick" x="600.0" y="189.4" fill="#94a3b8">1.0003  —  NOT about the outcome</text><text class="lbl" x="198" y="224.6" text-anchor="end">deterministic  ·  I_C(4)</text><rect x="210" y="210.1" width="380.7" height="21.1" fill="#2563eb" rx="2"/><text class="tick" x="599.7" y="224.6" fill="#2563eb">0.9996  —  about the outcome</text><text class="lbl" x="198" y="259.9" text-anchor="end">synergy_100  ·  I_C(4)</text><rect x="210" y="245.3" width="380.6" height="21.1" fill="#2563eb" rx="2"/><text class="tick" x="599.6" y="259.9" fill="#2563eb">0.9995  —  about the outcome</text><text class="lbl" x="198" y="295.1" text-anchor="end">synergy_050  ·  I_C(4)</text><rect x="210" y="280.6" width="75.1" height="21.1" fill="#2563eb" rx="2"/><text class="tick" x="294.1" y="295.1" fill="#2563eb">0.1971  —  about the outcome</text><text class="lbl" x="198" y="330.4" text-anchor="end">synergy_000  ·  I_C(4)</text><rect x="210" y="315.8" width="1.0" height="21.1" fill="#94a3b8" rx="2"/><text class="tick" x="220.0" y="330.4" fill="#94a3b8">0.0002  —  NOT about the outcome</text><text class="sub" x="24" y="370">The top two rows carry a FULL BIT of genuine structure and say nothing whatever about the outcome. The raw statistic cannot tell the difference;</text><text class="sub" x="24" y="386">the calibration can, because shuffling only the outcome leaves structure among the participants intact in the null.</text></svg>