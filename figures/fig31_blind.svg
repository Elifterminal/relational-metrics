<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Blind re-annotation">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">How much did knowing the answer help?</text><text class="sub" x="24" y="45">The same 24 documents, annotated twice: once knowing each one's role, once with the roles hidden.</text><text class="sub" x="24" y="61">Nothing about the documents changed. Only what the annotator could see.</text><text class="tick" x="160" y="88">0%</text><text class="tick" x="540" y="88" text-anchor="end">100%</text><text class="lbl" x="148" y="112" text-anchor="end">paraphrase</text><rect x="160" y="98" width="380.0" height="10" fill="#94a3b8" rx="2"/><rect x="160" y="111" width="245.9" height="10" fill="#2563eb" rx="2"/><text class="tick" x="548.0" y="107" font-family="monospace" fill="var(--mut)">100%</text><text class="tick" x="413.9" y="120" font-family="monospace" fill="#2563eb">65%</text><text class="lbl" x="148" y="146" text-anchor="end">analogue</text><rect x="160" y="132" width="380.0" height="10" fill="#94a3b8" rx="2"/><rect x="160" y="145" width="245.9" height="10" fill="#2563eb" rx="2"/><text class="tick" x="548.0" y="141" font-family="monospace" fill="var(--mut)">100%</text><text class="tick" x="413.9" y="154" font-family="monospace" fill="#2563eb">65%</text><text class="lbl" x="148" y="180" text-anchor="end">false friend</text><rect x="160" y="166" width="253.5" height="10" fill="#94a3b8" rx="2"/><rect x="160" y="179" width="134.1" height="10" fill="#2563eb" rx="2"/><text class="tick" x="421.5" y="175" font-family="monospace" fill="var(--mut)">67%</text><text class="tick" x="302.1" y="188" font-family="monospace" fill="#2563eb">35%</text><text class="lbl" x="148" y="214" text-anchor="end">generic</text><rect x="160" y="200" width="380.0" height="10" fill="#94a3b8" rx="2"/><rect x="160" y="213" width="335.2" height="10" fill="#2563eb" rx="2"/><text class="tick" x="548.0" y="209" font-family="monospace" fill="var(--mut)">100%</text><text class="tick" x="503.2" y="222" font-family="monospace" fill="#2563eb">88%</text><text class="lbl" x="148" y="248" text-anchor="end">unrelated</text><rect x="160" y="234" width="253.5" height="10" fill="#94a3b8" rx="2"/><rect x="160" y="247" width="268.3" height="10" fill="#2563eb" rx="2"/><text class="tick" x="421.5" y="243" font-family="monospace" fill="var(--mut)">67%</text><text class="tick" x="436.3" y="256" font-family="monospace" fill="#2563eb">71%</text><rect x="160" y="273" width="11" height="10" fill="#94a3b8" rx="2"/><text class="sub" x="178" y="282">annotated knowing the role</text><rect x="380" y="273" width="11" height="10" fill="#2563eb" rx="2"/><text class="sub" x="398" y="282">annotated blind</text><text class="sub" x="24" y="310" fill="#dc2626">Knowing a document was the paraphrase or the analogue, I annotated it into a PERFECT match with the query. Both</text><text class="sub" x="24" y="325" fill="#dc2626">fall to 65% when the roles are hidden — an overall inflation of 1.34x.</text><text class="sub" x="24" y="346" fill="#15803d">But the gap holds: blind, the analogue (65%) still clears the false friend (35%), and the claim survives on 3/4.</text><text class="sub" x="24" y="361">The record was flattered, not fabricated. State corpus results at the blind rate.</text></svg>