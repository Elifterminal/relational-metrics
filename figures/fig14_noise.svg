<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="The law under noise">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="400"/><text class="ttl" x="24" y="26">The deterministic law breaks under noise. The general one does not.</text><text class="sub" x="24" y="44">Worst-case error against brute-force exact mutual information, across all 254 functions at each noise level.</text><line class="ax" x1="70" y1="340.0" x2="570" y2="340.0"/><text class="tick" x="61" y="344.0" text-anchor="end">0.00</text><line class="ax" x1="70" y1="270.5" x2="570" y2="270.5"/><text class="tick" x="61" y="274.5" text-anchor="end">0.03</text><line class="ax" x1="70" y1="201.0" x2="570" y2="201.0"/><text class="tick" x="61" y="205.0" text-anchor="end">0.06</text><line class="ax" x1="70" y1="131.5" x2="570" y2="131.5"/><text class="tick" x="61" y="135.5" text-anchor="end">0.09</text><line class="ax" x1="70" y1="62.0" x2="570" y2="62.0"/><text class="tick" x="61" y="66.0" text-anchor="end">0.13</text><text class="tick" x="70.0" y="358" text-anchor="middle">0.00</text><text class="tick" x="170.0" y="358" text-anchor="middle">0.01</text><text class="tick" x="270.0" y="358" text-anchor="middle">0.05</text><text class="tick" x="370.0" y="358" text-anchor="middle">0.10</text><text class="tick" x="470.0" y="358" text-anchor="middle">0.20</text><text class="tick" x="570.0" y="358" text-anchor="middle">0.40</text><text class="lbl" x="320" y="386" text-anchor="middle">noise level</text><text class="lbl" transform="translate(22,201) rotate(-90)" text-anchor="middle">worst-case error</text><polyline points="70.0,340.0 170.0,306.0 270.0,242.2 370.0,196.4 470.0,143.0 570.0,98.3" fill="none" stroke="#dc2626" stroke-width="2.6"/><circle cx="70.0" cy="340.0" r="4" fill="#dc2626"/><circle cx="170.0" cy="306.0" r="4" fill="#dc2626"/><text class="tick" x="170.0" y="295.0" text-anchor="middle" fill="#dc2626">0.015</text><circle cx="270.0" cy="242.2" r="4" fill="#dc2626"/><text class="tick" x="270.0" y="231.2" text-anchor="middle" fill="#dc2626">0.044</text><circle cx="370.0" cy="196.4" r="4" fill="#dc2626"/><text class="tick" x="370.0" y="185.4" text-anchor="middle" fill="#dc2626">0.065</text><circle cx="470.0" cy="143.0" r="4" fill="#dc2626"/><text class="tick" x="470.0" y="132.0" text-anchor="middle" fill="#dc2626">0.089</text><circle cx="570.0" cy="98.3" r="4" fill="#dc2626"/><text class="tick" x="570.0" y="87.3" text-anchor="middle" fill="#dc2626">0.109</text><line x1="70" y1="340.0" x2="570" y2="340.0" stroke="#15803d" stroke-width="2.6"/><text class="tick" x="78" y="332.0" fill="#15803d">general form — error ~1e-16 everywhere</text><text class="sub" x="590" y="70">retention_e =</text><text class="sub" x="590" y="85">  1 - I(1-h(e)) / (H_e - h(e))</text><text class="sub" x="590" y="100"></text><text class="sub" x="590" y="115">Balanced outcomes are</text><text class="sub" x="590" y="130">EXACTLY noise-invariant:</text><text class="sub" x="590" y="145">drift 0.00e+00. H_e stays 1,</text><text class="sub" x="590" y="160">the noise term cancels, and</text><text class="sub" x="590" y="175">retention = 1 - Influence.</text><text class="sub" x="590" y="190"></text><text class="sub" x="590" y="205">That is why majority never</text><text class="sub" x="590" y="220">moved and AND did — an</text><text class="sub" x="590" y="235">observation that sat</text><text class="sub" x="590" y="250">unexplained for two</text><text class="sub" x="590" y="265">experiments.</text></svg>