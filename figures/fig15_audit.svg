<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Reordering audit">
<style>
  :root { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  }
  :root[data-theme="dark"] { --fg:#e8e8ea; --mut:#9ca3af; --grid:#2f3542; --bg:#0f1115; --accent:#f3f4f6; }
  :root[data-theme="light"] { --fg:#1a1a1a; --mut:#6b7280; --grid:#e5e7eb; --bg:#ffffff; --accent:#111827; }
  .bg { fill: var(--bg); }
  .ax { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .lbl { fill: var(--fg); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .ttl { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
  .sub { fill: var(--mut); font: 11px ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
  .ntxt { fill: var(--fg); font: 10px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
</style>
<rect class="bg" width="800" height="360"/><text class="ttl" x="24" y="26">Does varying this change the ORDER of the answer?</text><text class="sub" x="24" y="44">Rank agreement with the reference setting. 1.0 means nothing swapped; below 1.0 means decisions change.</text><line class="ax" x1="290.0" y1="60" x2="290.0" y2="304"/><text class="tick" x="290.0" y="322" text-anchor="middle">-0.25</text><line class="ax" x1="358.0" y1="60" x2="358.0" y2="304"/><text class="tick" x="358.0" y="322" text-anchor="middle">0.00</text><line class="ax" x1="426.0" y1="60" x2="426.0" y2="304"/><text class="tick" x="426.0" y="322" text-anchor="middle">0.25</text><line class="ax" x1="494.0" y1="60" x2="494.0" y2="304"/><text class="tick" x="494.0" y="322" text-anchor="middle">0.50</text><line class="ax" x1="562.0" y1="60" x2="562.0" y2="304"/><text class="tick" x="562.0" y="322" text-anchor="middle">0.75</text><line class="ax" x1="630.0" y1="60" x2="630.0" y2="304"/><text class="tick" x="630.0" y="322" text-anchor="middle">1.00</text><line x1="630.0" y1="60" x2="630.0" y2="304" stroke="#15803d" stroke-width="1.6" stroke-dasharray="4 3"/><text class="lbl" x="276" y="93.8" text-anchor="end">arity  (k=3 vs k=4)</text><rect x="290.0" y="77.4" width="340.0" height="24.8" fill="#15803d" rx="2"/><text class="tick" x="639.0" y="93.8" fill="#15803d">1.000 — order preserved</text><text class="lbl" x="276" y="141.4" text-anchor="end">which participant is hidden</text><rect x="290.0" y="125.0" width="36.1" height="24.8" fill="#dc2626" rx="2"/><text class="tick" x="335.1" y="141.4" fill="#dc2626">-0.117 — 12,288 pairs swap</text><text class="lbl" x="276" y="189.0" text-anchor="end">sample size</text><rect x="290.0" y="172.6" width="288.2" height="24.8" fill="#d97706" rx="2"/><text class="tick" x="587.2" y="189.0" fill="#d97706">0.809 — 2 pairs swap</text><text class="lbl" x="276" y="236.6" text-anchor="end">noise level</text><rect x="290.0" y="220.2" width="122.4" height="24.8" fill="#dc2626" rx="2"/><text class="tick" x="421.4" y="236.6" fill="#dc2626">0.200 — 6 pairs swap</text><text class="lbl" x="276" y="284.2" text-anchor="end">description code  (control)</text><rect x="290.0" y="267.8" width="223.4" height="24.8" fill="#d97706" rx="2"/><text class="tick" x="522.4" y="284.2" fill="#d97706">0.571 — 3 pairs swap</text><text class="sub" x="24" y="330">"Which participant is hidden" comes out slightly ANTI-correlated: best-case and worst-case retention rank structures</text><text class="sub" x="24" y="346">almost oppositely. Retention is not one number — it is one number per participant you might lose.</text></svg>